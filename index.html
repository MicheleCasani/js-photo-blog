<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- link font di google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Beginner:wght@400..700&display=swap" rel="stylesheet">
    <!-- link di bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!-- link file css -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- link per la chiamata axios nel file js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <title>Photo Blog</title>
</head>

<body>
    <!-- header -->
    <div class="container-fluid  justify-content-center">
        <header class="d-flex align-items-center justify-content-center">
            <h1>ESTATE '24</h1>
        </header>

        <main>
            <div class="container d-flex justify-content-center py-5">
                <div class="row justify-content-center" id="cards">
                    <!-- vado ad inseire le card dinamicamente tramite js -->
                </div>
            </div>
        </main>
    </div>

    <!-- overlay -->
    <div class="container-fluid bg-secondary bg-opacity-75 d-none" id="overlay">
        <div class="row text-center align-items-center justify-content-center">
            <button type="button" class="btn btn-light mb-3" id="button-close">INDIETRO</button>
            <div class="col-12" id="overlay-img">
                <!-- vado ad inseire l'immagine dinamicmente tramite js-->
            </div>
            <h2 class="mt-3">IMMAGINE SELEZIONATA</h2>
        </div>
    </div>
    <!-- link per lo script del file js -->
    <script src="./js/script.js"></script>
</body>

</html>
